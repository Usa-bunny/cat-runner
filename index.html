<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Dino Bot Runner</title>

    <link rel="stylesheet" href="index.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,700"
      rel="stylesheet"
    />

    <script src="index.js"></script>
  </head>

  <body id="t" class="offline">
    <div class="bot-control-panel">
      <span class="bot-title">🤖 Auto-Bot</span>
      <label class="switch">
        <input
          type="checkbox"
          id="botToggle"
          checked
          onchange="toggleBot(this.checked)"
        />
        <span class="slider"></span>
      </label>
    </div>

    <div class="game-wrapper">
      <div id="messageBox" class="sendmessage">
        <h1>Press Space to start</h1>
        <div class="niokbutton" onclick="okbuttonsend()"></div>
      </div>

      <div id="main-frame-error" class="interstitial-wrapper">
        <div id="main-content">
          <div class="icon icon-offline" alt="Dino Offline Icon"></div>
        </div>

        <div id="offline-resources">
          <img
            id="offline-resources-1x"
            src="assets/default_100_percent/100-offline-sprite.png"
            alt="Offline Sprite 1x"
          />
          <img
            id="offline-resources-2x"
            src="assets/default_200_percent/200-offline-sprite.png"
            alt="Offline Sprite 2x"
          />
          <template id="audio-resources">
            <audio id="offline-sound-press"></audio>
            <audio id="offline-sound-hit"></audio>
            <audio id="offline-sound-reached"></audio>
          </template>
        </div>
      </div>
    </div>

    <footer class="game-footer">
      <a href="https://github.com/Usa-bunny/dino-runner"
        >Dino Bot Runner &mdash; Built for fun.</a
      >
    </footer>

    <script>
      document.onkeydown = function (evt) {
        evt = evt || window.event;
        if (evt.keyCode == 32) {
          var box = document.getElementById("messageBox");
          if (box) box.style.visibility = "hidden";
        }
      };

      window.botIntervalToken = null;

      function toggleBot(isActive) {
        if (!isActive) {
          if (window.botIntervalToken) {
            clearInterval(window.botIntervalToken);
            window.botIntervalToken = null;
            console.log("Dino-Bot: DEACTIVATED");
          }
          return;
        }

        if (window.botIntervalToken) clearInterval(window.botIntervalToken);

        window.botIntervalToken = setInterval(function () {
          const instance = window.Runner.instance_;

          if (
            !instance ||
            instance.crashed ||
            !instance.horizon.obstacles.length
          )
            return;

          const obstacle = instance.horizon.obstacles[0];

          if (obstacle.xPos < instance.currentSpeed * 25) {
            if (
              obstacle.typeConfig &&
              obstacle.typeConfig.type === "PTERODACTYL" &&
              obstacle.yPos < 75
            ) {
              instance.tRex.setDuck(true);
            } else {
              if (!instance.tRex.jumping) {
                instance.tRex.startJump(instance.currentSpeed);
              }
            }
          } else {
            if (instance.tRex.ducking) {
              instance.tRex.setDuck(false);
            }
          }
        }, 5);

        console.log("Dino-Bot: ACTIVATED");
      }

      window.addEventListener("load", function () {
        setTimeout(function () {
          toggleBot(true);
        }, 500);
      });
    </script>
  </body>
</html>
